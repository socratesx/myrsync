name: Release

# After a version bump is merged to main: build the bundle, sign it, publish a
# GitHub release with that bundle attached, then upload it to the Play beta track.
#
# Secrets live in the "release" environment, not the repository. That
# environment only accepts the main branch and waits for an approval, so
# pull requests (including forks) never see them.
#   ANDROID_KEYSTORE_BASE64    base64 of the upload .jks
#   ANDROID_KEYSTORE_PASSWORD  store password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#   PLAY_SERVICE_ACCOUNT_JSON  Play Console service account key
#
# Third-party actions are pinned to commits because they receive those secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  release:
    name: GitHub release and Play upload
    if: github.repository == 'socratesx/myrsync'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Publish to Google Play
        uses: deep-rent/publish-android-release@v2.1.3
        with:
          project-directory: '.'
          package-name: 'com.linminitools.myrsync'
          keystore: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          service-account: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          track: 'internal'
          status: 'completed'

      # - name: Create GitHub release
      #   uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
      #   with:
      #     tag_name: v${{ steps.version.outputs.version_name }}
      #     name: v${{ steps.version.outputs.version_name }}
      #     target_commitish: ${{ github.sha }}
      #     generate_release_notes: true
      #     fail_on_unmatched_files: true
