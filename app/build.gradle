plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linminitools.myrsync'
    compileSdk 34

    defaultConfig {
        applicationId "com.linminitools.myrsync"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "0.13.1"
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "myRSync-${variant.name}-${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', 'src/main/assets/']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def rsyncBinary = file("$projectDir/src/main/assets/rsync_binary/arm64-v8a/rsync")

tasks.register("verifyRsyncBinary") {
    inputs.property("rsyncPath", rsyncBinary.absolutePath)
    doLast {
        if (!rsyncBinary.exists()) {
            throw new GradleException("Missing arm64-v8a rsync binary. Run scripts/build_rsync_android.sh before building.")
        }
        if (!rsyncBinary.canExecute()) {
            throw new GradleException("arm64-v8a rsync binary exists but is not executable. Re-run scripts/build_rsync_android.sh or chmod +x.")
        }
    }
}

preBuild.dependsOn tasks.named("verifyRsyncBinary")

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.collection:collection:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'org.jetbrains:annotations:24.0.1'

    // tasker plugin dependencies removed in favour of the in-app implementation
}
