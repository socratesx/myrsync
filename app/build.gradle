plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linminitools.myrsync'
    compileSdk 34

    defaultConfig {
        applicationId "com.linminitools.myrsync"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "0.13.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "myRSync-${variant.name}-${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }
}

def rsyncSharedLibrary = file("$projectDir/src/main/jniLibs/arm64-v8a/librsync-android.so")

tasks.register("verifyRsyncSharedLibrary") {
    inputs.property("rsyncLibraryPath", rsyncSharedLibrary.absolutePath)
    doLast {
        if (!rsyncSharedLibrary.exists()) {
            throw new GradleException("Missing arm64-v8a librsync shared library. Run scripts/build_rsync_android.sh before building.")
        }
        if (rsyncSharedLibrary.length() == 0L) {
            throw new GradleException("arm64-v8a librsync shared library exists but appears to be empty. Re-run scripts/build_rsync_android.sh.")
        }
    }
}

preBuild.dependsOn tasks.named("verifyRsyncSharedLibrary")

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.collection:collection:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'org.jetbrains:annotations:24.0.1'

    // tasker plugin dependencies removed in favour of the in-app implementation
}
