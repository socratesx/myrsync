plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.linminitools.myrsync"
    compileSdk 35

    defaultConfig {
        applicationId "com.linminitools.myrsync"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "0.13.1"
        // Keep in sync with the one-time product id created in Play Console.
        buildConfigField "String", "PRO_PRODUCT_ID", "\"myrsync_pro\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "myRSync-${variant.name}-${variant.versionName}.apk"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            minifyEnabled false
            debuggable false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', 'src/main/assets/']
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

configurations.all {
    resolutionStrategy {
        force 'com.twofortyfouram:android-annotation:3.0.0'
        force 'com.twofortyfouram:android-assertion:2.0.0'
        force 'com.twofortyfouram:android-spackle:2.0.3'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.collection:collection:1.4.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.annotation:annotation:1.8.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains:annotations:23.0.0'
    implementation 'com.android.billingclient:billing:7.1.1'

    //tasker plugin dependencies
    implementation 'com.twofortyfouram:android-annotation:3.0.0'
    implementation 'com.twofortyfouram:android-assertion:2.0.0'
    implementation 'com.twofortyfouram:android-plugin-api-for-locale:1.0.4'
    implementation 'com.twofortyfouram:android-plugin-client-sdk-for-locale:4.0.3'
    implementation 'com.twofortyfouram:android-spackle:2.0.3'
}
