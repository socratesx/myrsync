plugins {
    id 'com.android.application'
}

android {
    namespace 'com.linminitools.myrsync'
    compileSdk 34

    defaultConfig {
        applicationId "com.linminitools.myrsync"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "0.13.1"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.outputFileName = "myRSync-${variant.name}-${variant.versionName}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        beta {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // Extract the packaged PIE into the installer-owned executable directory.
            useLegacyPackaging = true
            excludes += ['**/librsync-android.so', '**/libmyrsync-jni.so']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }
}

def rsyncExecutable = file("$projectDir/src/main/jniLibs/arm64-v8a/librsync-exec.so")
def buildRsyncExecutableScript = file("$rootDir/scripts/build_rsync_android.sh")

tasks.register("prepareRsyncExecutable") {
    inputs.file(buildRsyncExecutableScript)
    outputs.file(rsyncExecutable)

    doLast {
        if (!buildRsyncExecutableScript.exists()) {
            throw new GradleException("Unable to locate scripts/build_rsync_android.sh. Cannot build rsync executable automatically.")
        }

        try {
            project.exec {
                commandLine("bash", buildRsyncExecutableScript.absolutePath)
            }
        } catch (Exception exception) {
            throw new GradleException("Failed to build rsync executable automatically. Run scripts/build_rsync_android.sh manually for more details.", exception)
        }
    }
}

tasks.register("verifyRsyncExecutable") {
    inputs.property("rsyncExecutablePath", rsyncExecutable.absolutePath)
    doLast {
        if (!rsyncExecutable.exists()) {
            throw new GradleException("Missing arm64-v8a rsync executable. Run scripts/build_rsync_android.sh before building.")
        }
        if (rsyncExecutable.length() == 0L) {
            throw new GradleException("arm64-v8a rsync executable exists but appears to be empty. Re-run scripts/build_rsync_android.sh.")
        }
    }
}

tasks.named("verifyRsyncExecutable").configure {
    mustRunAfter("prepareRsyncExecutable")
}

tasks.named("preBuild").configure {
    dependsOn("prepareRsyncExecutable")
    dependsOn("verifyRsyncExecutable")
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.collection:collection:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'org.jetbrains:annotations:24.0.1'

    // tasker plugin dependencies removed in favour of the in-app implementation
}
