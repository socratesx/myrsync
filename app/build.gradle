plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.linminitools.myrsync"
    // core 1.19.1 requires compile SDK 37. targetSdk stays 36 so runtime behavior is unchanged.
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = "com.linminitools.myrsync"
        minSdk = 23
        targetSdk = 36
        versionCode = 20
        versionName = "1.0.2"
        // Keep in sync with the one-time product id created in Play Console.
        buildConfigField "String", "PRO_PRODUCT_ID", "\"myrsync_pro\""
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    // APK filename is left as the AGP default (myRSync uses AAB for Play).
    // Custom outputFileName required the legacy Variant API (android.newDsl=false).

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Package native debug symbols into the AAB for Play crash symbolication.
            // Prefers function names without the larger FULL DWARF payload.
            ndk {
                debugSymbolLevel = "SYMBOL_TABLE"
            }
        }
        beta {
            minifyEnabled = true
            shrinkResources = true
            debuggable = false
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel = "SYMBOL_TABLE"
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.collection:collection:1.7.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.annotation:annotation:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'com.android.billingclient:billing:9.1.0'
}
